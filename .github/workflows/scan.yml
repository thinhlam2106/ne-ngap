name: AI xem camera ngập

on:
  schedule:
    - cron: '*/10 * * * *'      # 10 phút một lần (GitHub có thể chạy trễ vài phút)
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Quét tất cả camera ngay, không cần chờ trời mưa'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Cài thư viện
        run: pip install -r scanner/requirements.txt

      - name: AI xem camera
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_ALL: ${{ inputs.scan_all }}
          DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '1.5' }}
          DRY_SCAN_HOURS: ${{ vars.DRY_SCAN_HOURS || '3' }}
        run: python scanner/scan.py

      - name: Lưu kết quả lên bản đồ
        run: |
          git config user.name "ne-ngap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flood-ai.json data/state.json
          if git diff --cached --quiet; then echo "Không có gì mới."; exit 0; fi
          git commit -m "Cập nhật ngập từ camera"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
