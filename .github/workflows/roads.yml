name: Tải mạng lưới đường OpenStreetMap (đúng nút giao, chiều đi, cấm rẽ)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 0'      # 3 giờ 30 sáng thứ Hai (giờ Việt Nam): cập nhật lại mỗi tuần

permissions:
  contents: write

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài công cụ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Tải bản đồ Việt Nam (Geofabrik) và cắt vùng TP.HCM
        run: |
          curl -fsSL --retry 3 -o vn.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
          ls -la vn.pbf
          # TP.HCM mới (gồm Bình Dương, Bà Rịa - Vũng Tàu cũ) và dải giáp ranh
          osmium extract -b 106.20,10.20,107.70,11.65 vn.pbf -o hcm.pbf --overwrite
          osmium tags-filter hcm.pbf w/highway w/route=ferry r/type=restriction -o hcm-roads.pbf --overwrite
          ls -la hcm.pbf hcm-roads.pbf
      - name: Tách dữ liệu tìm đường
        run: |
          mkdir -p data/osm
          python scanner/osm_roads.py hcm-roads.pbf data/osm/roads.json.gz
          ls -la data/osm
      - name: Lưu vào repo
        run: |
          git config user.name "ne-ngap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm/roads.json.gz data/osm/roads_summary.json
          if git diff --cached --quiet; then echo "Không có gì mới."; exit 0; fi
          git commit -m "Cập nhật mạng lưới đường OpenStreetMap"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
